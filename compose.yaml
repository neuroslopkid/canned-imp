services:
  mongo:
    image: mongo:latest

    restart: on-failure:3

    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_INITDB_ROOT_USERNAME:-rootdb}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_INITDB_ROOT_PASSWORD:-exampledb}"

    ports:
      - "${MONGO_PORT:-27017}:27017"

    volumes:
      - mongo_data:/data/db

  mongo-express:
    image: mongo-express:latest

    restart: on-failure:3

    depends_on:
      - mongo

    ports:
      - "${ME_PORT:-8001}:8081"

    environment:
      ME_CONFIG_MONGODB_URL: "mongodb://${MONGO_INITDB_ROOT_USERNAME:-rootdb}:${MONGO_INITDB_ROOT_PASSWORD:-exampledb}@mongo:${MONGO_PORT:-27017}/"
      ME_CONFIG_BASICAUTH_ENABLED: true
      ME_CONFIG_BASICAUTH_USERNAME: "${ME_CONFIG_BASICAUTH_USERNAME:-examplemeuser}"
      ME_CONFIG_BASICAUTH_PASSWORD: "${ME_CONFIG_BASICAUTH_PASSWORD:-examplemepass}"

  express:
    build:
      context: ./server
      dockerfile: Dockerfile.express

    working_dir: /app
    restart: on-failure:3
    depends_on:
      - mongo
    ports:
      - "${EXPRESS_PORT:-3000}:3000"

    environment:
      PORT: 3000

      MONGO_URL: "mongodb://${MONGO_INITDB_ROOT_USERNAME:-rootdb}:${MONGO_INITDB_ROOT_PASSWORD:-exampledb}@mongo:27017/appdb?authSource=admin"

    volumes:
      - ./server:/app
      - /app/node_modules

  jenkins-with-docker:
    container_name: jenkins-with-docker
    image: jenkins-with-docker
    build:
      context: .
      dockerfile: Dockerfiles/Dockerfile.jenkins
    restart: unless-stopped
    environment:
      - DOCKER_HOST=tcp://docker:2376
      - DOCKER_CERT_PATH=/certs/client
      - DOCKER_TLS_VERIFY=1
    volumes:
      - jenkins_home:/var/jenkins_home
      - jenkins_docker_certs:/certs/client:ro
    ports:
      - "${JENKINS_WEBUI_PORT:-8080}:8080"
      - "${JENKINS_AGENTS_PORT:-50000}:50000"
    networks:
      - jenkins-network
    depends_on:
    - docker-in-jenkins

  docker-in-jenkins:
    container_name: docker-in-jenkins
    image: docker:dind
    privileged: true
    environment:
      - DOCKER_TLS_CERTDIR=/certs
    volumes:
      - jenkins_docker_certs:/certs/client
      - jenkins_home:/var/jenkins_home
    ports:
      - "${JENKINS_DIND_PORT:-2376}:2376"
    networks:
      jenkins-network:
        aliases:
          - docker
    command: --storage-driver overlay2

networks:
  jenkins-network:
    driver: bridge

volumes:
  mongo_data:
  jenkins_home:
  jenkins_docker_certs:
