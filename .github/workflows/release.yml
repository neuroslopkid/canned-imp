name: Release APK

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Expo prebuild
        run: npx expo prebuild --no-install

      # Decode the CI keystore from GitHub secret
      - name: Decode keystore
        run: |
          echo "${{ secrets.CI_RELEASE_KEYSTORE }}" | base64 -d > android/app/ci-release-key.jks

      # Expo embeds EXPO_PUBLIC_* at bundle time
      - name: Set environment
        run: |
          echo "EXPO_PUBLIC_API_URL=${{ secrets.EXPO_PUBLIC_API_URL }}" >> $GITHUB_ENV

      - name: Build Android APK
        env:
          STORE_PASSWORD: ${{ secrets.CI_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CI_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CI_RELEASE_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease \
            -P MYAPP_UPLOAD_STORE_FILE=ci-release-key.jks \
            -P MYAPP_UPLOAD_STORE_PASSWORD="$STORE_PASSWORD" \
            -P MYAPP_UPLOAD_KEY_ALIAS="$KEY_ALIAS" \
            -P MYAPP_UPLOAD_KEY_PASSWORD="$KEY_PASSWORD"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: app-release
      - name: Create source archive
        run: git archive --format=zip -o canned-imp-source.zip HEAD

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          body: "Automated release from commit ${{ github.sha }}"
          files: |
            *.apk
            source-code.zip
          generate_release_notes: true
